<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT - Images</title>
    <link rel="stylesheet" href="images.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    
    <header class="navbar-images">
        <div class="nav-left">
            <a href="main.html" class="logo-link">
                <span class="logo-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
                </span>
            </a>
            <span class="logo-text">ChatGPT <span class="arrow">⌄</span></span>
        </div>

        <div class="nav-right">
            <button class="btn-login">Log in</button>
            <button class="btn-signup">Sign up for free</button>
            <button class="btn-help">?</button>
        </div>
    </header>

  
    <main class="images-container">
        <h2 class="section-title">Images</h2>
        <p class="section-subtitle">Try a style on an image</p>

       
        <div class="gallery">
            <div class="gallery-card">
                <div class="card-img">
                    <img src="img/1.png" alt="Sketch" class="card-img-tag"></div>
                
                <span class="card-label">Sketch</span>
            </div>
            <div class="gallery-card">
                <div class="card-img">
                <img src="img/2.png" alt="Dramatic" class="card-img-tag"></div>
                <span class="card-label">Dramatic</span>
            </div>
            <div class="gallery-card">
                <div class="card-img">
                    <img src="img/3.png" alt="Plushie" class="card-img-tag">
                </div>
                <span class="card-label">Plushie</span>
            </div>
            <div class="gallery-card">
                <div class="card-img">
                    <img src="img/4.png" alt="Retro anime" class="card-img-tag">
                </div>
                <span class="card-label">Retro anime</span>
            </div>
            <div class="gallery-card">
                <div class="card-img"><img src="img/6.png" alt="Baseball bobblehead" class="card-img-tag"></div>
                <span class="card-label">Baseball bobblehead</span>
            </div>
            <div class="gallery-card">
                <div class="card-img"><img src="img/5.png" alt="Doodle" class="card-img-tag"></div>
                <span class="card-label">Doodle</span>
            </div>
        </div>

       
        <h3 class="subsection-title">Discover something new</h3>
        
        <div class="discover-list">
            <div class="left-list">
            <div class="discover-item">
                <img src="img/1.1.png" alt="Girl" class="small-thumb">
                <span class="discover-text">Me as The Girl with a Pearl</span>
            </div>
            <div class="discover-item">
                <img src="img/1.2.png" alt="Remove" class="small-thumb">
                <span class="discover-text">Remove people in the background</span>
            </div>
            <div class="discover-item">
                 <img src="img/1.3.png" alt="would I look like" class="small-thumb">
                <span class="discover-text">What would I look like as a K-Pop star?</span>
            </div>
            </div>
            <div class="right-list">
            <div class="discover-item discover-item-right">
                <img src="img/1.4.png" alt="Create a professional product photo" class="small-thumb">
                <span class="discover-text">Create a professional product photo</span>
            </div>
            <div class="discover-item discover-item-right">
                 <img src="img/1.5.png" alt="Style me" class="small-thumb">
                <span class="discover-text">Style me</span>
            </div>
            <div class="discover-item discover-item-right">
                
                   <img src="img/1.6.png" alt="Turn into a keychain" class="small-thumb">
                <span class="discover-text">Turn into a keychain</span>
            </div>
            </div>
        </div>
    </main>

</body>
</html>
